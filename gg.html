<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a1628;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      height: 90vh;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0f2044;
      border: 1px solid #1e3a6e;
      border-radius: 14px 14px 0 0;
      padding: 1rem 1.25rem;
    }

    .chat-header .avatar {
      width: 40px; height: 40px;
      background: #1a4fa8;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #7eb8f7;
      flex-shrink: 0;
    }

    .chat-header .info h2 {
      font-size: 15px; font-weight: 600; color: #e8f0fe; margin: 0;
    }

    .chat-header .info p {
      font-size: 12px; color: #5dcaa5; margin: 0;
      display: flex; align-items: center; gap: 4px;
    }

    .chat-header .info p::before {
      content: ''; width: 7px; height: 7px;
      background: #5dcaa5; border-radius: 50%; display: inline-block;
    }

    .chat-header .model-badge {
      margin-left: auto;
      font-size: 11px; font-weight: 500;
      color: #7eb8f7;
      background: #0a1628;
      border: 1px solid #1e3a6e;
      border-radius: 20px;
      padding: 4px 12px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      background: #0c1c38;
      border-left: 1px solid #1e3a6e;
      border-right: 1px solid #1e3a6e;
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #1e3a6e; border-radius: 4px; }

    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }

    .msg-row.bot  .msg-avatar { background: #1a4fa8; color: #7eb8f7; }
    .msg-row.user .msg-avatar { background: #163366; color: #7eb8f7; }

    .msg-bubble {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }

    .msg-row.bot  .msg-bubble {
      background: #0f2044;
      border: 1px solid #1e3a6e;
      color: #d0dff7;
      border-bottom-left-radius: 4px;
    }

    .msg-row.user .msg-bubble {
      background: #1a4fa8;
      color: #e8f0fe;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: #3a5a9a;
      margin-top: 4px;
      padding: 0 4px;
    }

    .msg-row.user .msg-time { text-align: right; }

    .typing {
      display: flex; gap: 5px; align-items: center;
      padding: 0.75rem 1rem;
      background: #0f2044;
      border: 1px solid #1e3a6e;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing span {
      width: 7px; height: 7px;
      background: #3a5a9a;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); background: #7eb8f7; }
    }

    .chat-input-area {
      background: #0f2044;
      border: 1px solid #1e3a6e;
      border-top: none;
      border-radius: 0 0 14px 14px;
      padding: 1rem 1.25rem;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .chat-input-area textarea {
      flex: 1;
      background: #0a1628;
      border: 1px solid #1e3a6e;
      border-radius: 10px;
      color: #e8f0fe;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      resize: none;
      min-height: 46px;
      max-height: 140px;
      line-height: 1.5;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .chat-input-area textarea::placeholder { color: #3a5a9a; }

    .chat-input-area textarea:focus {
      border-color: #1a4fa8;
      box-shadow: 0 0 0 3px rgba(26, 79, 168, 0.2);
    }

    .send-btn {
      width: 46px; height: 46px;
      background: #1a4fa8;
      border: none; border-radius: 10px;
      color: #e8f0fe; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover  { background: #2563c7; }
    .send-btn:active { background: #0c447c; }
    .send-btn:disabled { background: #163366; cursor: not-allowed; color: #3a5a9a; }

    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex: 1; gap: 12px; color: #3a5a9a;
      text-align: center; padding: 2rem;
    }

    .empty-state i { font-size: 48px; color: #1e3a6e; }
    .empty-state h3 { font-size: 16px; color: #6b84b8; font-weight: 500; }
    .empty-state p  { font-size: 13px; color: #3a5a9a; }

    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 0.5rem;
    }

    .suggestion {
      background: #0f2044;
      border: 1px solid #1e3a6e;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px; color: #7eb8f7;
      cursor: pointer; transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .suggestion:hover { background: #1a4fa8; border-color: #1a4fa8; color: #e8f0fe; }

    .api-bar {
      width: 100%; max-width: 720px;
      display: flex; gap: 8px;
      margin-bottom: 10px;
    }

    .api-bar input {
      flex: 1; height: 38px;
      background: #0f2044;
      border: 1px solid #1e3a6e;
      border-radius: 8px;
      color: #e8f0fe; font-family: 'Inter', sans-serif;
      font-size: 13px; padding: 0 12px; outline: none;
    }

    .api-bar input::placeholder { color: #3a5a9a; }
    .api-bar input:focus { border-color: #1a4fa8; }

    .api-bar button {
      height: 38px; padding: 0 16px;
      background: #1a4fa8; color: #e8f0fe;
      border: none; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: 'Inter', sans-serif;
      transition: background 0.2s;
    }

    .api-bar button:hover { background: #2563c7; }

    .api-status {
      font-size: 11px; text-align: center;
      margin-bottom: 8px; min-height: 14px;
    }

    .api-status.ok  { color: #5dcaa5; }
    .api-status.err { color: #f09595; }
  </style>
</head>
<body>

  <div class="api-bar">
    <input type="password" id="apiKey" placeholder="AIzaSyADrl1g0dx01uuoWNx55JFdWMjMQBym2NY"/>
    <button onclick="saveKey()">Save Key</button>
  </div>
  <p class="api-status" id="apiStatus"></p>

  <div class="chat-wrapper">

    <div class="chat-header">
      <div class="avatar"><i class="ti ti-robot"></i></div>
      <div class="info">
        <h2>AI Assistant</h2>
        <p>Online</p>
      </div>
      <span class="model-badge">Gemini 1.5 Flash</span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="empty-state" id="emptyState">
        <i class="ti ti-message-circle"></i>
        <h3>Start a conversation</h3>
        <p>Ask me anything — I'm powered by Google Gemini</p>
        <div class="suggestions">
          <button class="suggestion" onclick="quickSend('What can you do?')">What can you do?</button>
          <button class="suggestion" onclick="quickSend('Explain AI in simple terms')">Explain AI simply</button>
          <button class="suggestion" onclick="quickSend('Write a short poem')">Write a poem</button>
          <button class="suggestion" onclick="quickSend('Give me a fun fact')">Fun fact</button>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <textarea id="userInput" placeholder="Type a message..." rows="1"
        onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendMessage(); }"
        oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <i class="ti ti-send"></i>
      </button>
    </div>

  </div>

  <script>
    let API_KEY = '';
    let history = [];
    let isTyping = false;

    function saveKey() {
      const key = document.getElementById('apiKey').value.trim();
      const status = document.getElementById('apiStatus');
      if (!key) {
        status.className = 'api-status err';
        status.textContent = 'Please enter an API key.';
        return;
      }
      API_KEY = key;
      status.className = 'api-status ok';
      status.textContent = 'API key saved. Start chatting!';
      document.getElementById('apiKey').value = '';
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function getTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function removeEmpty() {
      const e = document.getElementById('emptyState');
      if (e) e.remove();
    }

    function appendMessage(role, text) {
      removeEmpty();
      const container = document.getElementById('chatMessages');
      const row = document.createElement('div');
      row.className = 'msg-row ' + role;

      const icon = role === 'bot' ? 'ti-robot' : 'ti-user';
      row.innerHTML = `
        <div class="msg-avatar"><i class="ti ${icon}"></i></div>
        <div>
          <div class="msg-bubble">${text}</div>
          <div class="msg-time">${getTime()}</div>
        </div>`;

      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
      return row;
    }

    function showTyping() {
      removeEmpty();
      const container = document.getElementById('chatMessages');
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.id = 'typingIndicator';
      row.innerHTML = `
        <div class="msg-avatar"><i class="ti ti-robot"></i></div>
        <div class="typing"><span></span><span></span><span></span></div>`;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typingIndicator');
      if (t) t.remove();
    }

    function quickSend(text) {
      document.getElementById('userInput').value = text;
      sendMessage();
    }

    async function sendMessage() {
      if (isTyping) return;

      if (!API_KEY) {
        document.getElementById('apiStatus').className = 'api-status err';
        document.getElementById('apiStatus').textContent = 'Please enter your Gemini API key above first.';
        return;
      }

      const input = document.getElementById('userInput');
      const text  = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';
      isTyping = true;
      document.getElementById('sendBtn').disabled = true;

      appendMessage('user', text);
      history.push({ role: 'user', parts: [{ text }] });

      showTyping();

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: history })
          }
        );

        const data = await res.json();
        removeTyping();

        if (data.error) {
          appendMessage('bot', 'Error: ' + data.error.message);
        } else {
          const reply = data.candidates[0].content.parts[0].text;
          history.push({ role: 'model', parts: [{ text: reply }] });
          appendMessage('bot', reply.replace(/\n/g, '<br/>'));
        }

      } catch (err) {
        removeTyping();
        appendMessage('bot', 'Something went wrong. Check your API key and try again.');
      }

      isTyping = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('userInput').focus();
    }
  </script>

</body>
</html>
